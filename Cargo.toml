[workspace]
members = [".", "highs-wasm"]

[package]
name = "lio-highs"
version = "0.1.0"
authors = ["Mohammed Ghannam <mohammad.m.ghannam@gmail.com>"]
edition = "2021"
description = "Rust bindings for the HiGHS linear programming solver, customized for lio."
license = "MIT"
repository = "https://github.com/mmghannam/lio-highs"
keywords = ["linear-programming", "optimization", "math", "solver"]

[dependencies]
log = "0.4"

[build-dependencies]
bindgen = "0.71.1"
cmake = "0.1.49"
cc = "1"

[features]
default = ["highs_release"]
highs_release = []
ninja = []
libz = []
inst-count = []
rucks = []
# Per-function loop attribution on top of `rucks`: loops are attributed to
# the HiGHS function that contains them (plus the function-entry counting
# registration), and the pf runtime exposes per-function counters instead of
# a single aggregate. Implies `rucks` (the bucketed loop runtime + rucks_core
# are still linked; pf mode routes loop increments into the pf table).
rucks-pf = ["rucks"]
